  <!-- THEME FLASH PREVENTION (runs before render)               -->
  <!-- ========================================================= -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('govexam_theme');
        var prefDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved ? saved : (prefDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>
